name: Release

# A tag v* builds everything and opens a draft release with it. A pull request
# that touches the packaging builds everything too, so a broken packager is
# found before the tag rather than after it; nothing is released from a PR.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/release.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:

env:
  QT_VERSION: '6.11.2'
  CMAKE_BUILD_TYPE: Release

# ─────────────────────────────────────────────────────────────────────────────
jobs:

# ── Linux — AppImage ──────────────────────────────────────────────────────────
# Pinned to 22.04 rather than ubuntu-latest: an AppImage inherits the glibc of
# the machine that built it, so the oldest supported image is the one that runs
# on the most distros. 24.04 also dropped `libfuse2` (renamed `libfuse2t64`),
# which AppImages need to self-mount.
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libgl1-mesa-dev libgles2-mesa-dev \
            libxcb-cursor0 libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-render-util0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev libxkbcommon-x11-dev \
            libfuse2 \
            imagemagick

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtserialport'
          cache: true

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel

      - name: Package AppImage
        run: bash packaging/linux/build-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchboard-linux-appimage
          path: dist/watchboard-*.AppImage
          if-no-files-found: error

# ── Windows — Inno Setup installer ────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: 'qtserialport'
          cache: true
          # Qt reorganised its Windows repository at 6.11: the metadata moved from
          # qt6_611N/qt6_611N/ to one directory per compiler (qt6_611N_msvc2022_64/).
          # Released aqtinstall 3.3.0 still builds the old path and 404s, so the
          # Windows job needs the unreleased fix. Pinned to a commit, never a
          # branch. Drop this once aqtinstall 3.4.0 is on PyPI.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ISCC ships with the runner image but is not on PATH; install it only if
      # this image ever stops carrying it.
      - name: Put Inno Setup on PATH
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$iscc\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          Add-Content -Path $env:GITHUB_PATH -Value $iscc

      # NMake builds one file at a time; Ninja is parallel and is what the other
      # two jobs use. It is not on the runner image.
      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy and package
        shell: pwsh
        run: packaging\windows\deploy.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchboard-windows-setup
          path: dist/WatchBoard-*-setup.exe
          if-no-files-found: error

# ── macOS — DMG ───────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtserialport'
          cache: true

      # Ninja on purpose: with Unix Makefiles, `--parallel` with no job count
      # hands make a bare `-j`, which starts every translation unit at once.
      # It ships on the macOS runner image.
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel

      # Signing is opt-in through repository secrets, and every step below is a
      # no-op without them: a checkout that has none still produces an ad-hoc
      # signed DMG instead of failing. The six that turn it on are
      # MACOS_CERT_P12 (the Developer ID .p12, base64), MACOS_CERT_PASSWORD,
      # MACOS_DEVELOPER_ID (the certificate's common name), and for
      # notarization MACOS_NOTARY_KEY (an App Store Connect .p8, base64),
      # MACOS_NOTARY_KEY_ID and MACOS_NOTARY_ISSUER.
      - name: Import signing certificate
        env:
          CERT_P12:      ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "No MACOS_CERT_P12 secret — the DMG will be signed ad-hoc."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
              -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # A .p12 exported without the chain leaves codesign unable to reach
          # the Apple root, so the intermediate is fetched here.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
              https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          # Without this, codesign stops on a GUI prompt for the key that no one
          # is there to answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

      - name: Package DMG
        env:
          DEVELOPER_ID:   ${{ secrets.MACOS_DEVELOPER_ID }}
          NOTARY_KEY_B64: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID:  ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER:  ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
          if [ -n "$NOTARY_KEY_B64" ]; then
            printf '%s' "$NOTARY_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          fi
          bash packaging/macos/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchboard-macos-dmg
          path: dist/WatchBoard-*.dmg
          if-no-files-found: error

# ── Firmware — Arduino library zip ────────────────────────────────────────────
# The zip is built from the tracked files only, and installed and compiled for
# one board of each supported architecture before it is uploaded: the library
# that ships is the one that was compiled, not the source tree next to it.
  build-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ARDUINO_DIRECTORIES_DATA:      ${{ github.workspace }}/.arduino/data
      ARDUINO_DIRECTORIES_DOWNLOADS: ${{ github.workspace }}/.arduino/downloads
      ARDUINO_DIRECTORIES_USER:      ${{ github.workspace }}/.arduino/user
      ARDUINO_LIBRARY_ENABLE_UNSAFE_INSTALL: 'true'   # for `lib install --zip-path`
      ESP32_INDEX:   https://espressif.github.io/arduino-esp32/package_esp32_index.json
      ESP8266_INDEX: https://arduino.esp8266.com/stable/package_esp8266com_index.json

    steps:
      - uses: actions/checkout@v4

      - name: Package library
        run: bash packaging/firmware/package-library.sh

      - uses: arduino/setup-arduino-cli@v2

      # arduino-cli's own downloader has been seen to get a 404 from the
      # esp8266 index host where curl gets the file, so that index is put in
      # place by hand and the cores are installed from what is on disk.
      - name: Install cores
        run: |
          mkdir -p "$ARDUINO_DIRECTORIES_DATA"
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          curl -fsSL "$ESP8266_INDEX" -o "$ARDUINO_DIRECTORIES_DATA/package_esp8266com_index.json"
          arduino-cli core install arduino:avr arduino:samd
          arduino-cli core install esp32:esp32 esp8266:esp8266 \
              --additional-urls "$ESP32_INDEX,$ESP8266_INDEX"

      - name: Install the zip and compile the example
        run: |
          arduino-cli lib install --zip-path dist/WatchBoard-library-*.zip
          example="$ARDUINO_DIRECTORIES_USER/libraries/WatchBoard/examples/BasicMonitor"
          for fqbn in arduino:avr:uno arduino:avr:mega arduino:samd:mkrzero \
                      esp32:esp32:esp32 esp32:esp32:esp32c3 esp8266:esp8266:nodemcuv2; do
            echo "── $fqbn"
            arduino-cli compile --warnings all -b "$fqbn" \
                --additional-urls "$ESP32_INDEX,$ESP8266_INDEX" "$example"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchboard-firmware-library
          path: dist/WatchBoard-library-*.zip
          if-no-files-found: error

# ── Release — attach all artifacts to the tag ─────────────────────────────────
  release:
    needs: [build-linux, build-windows, build-macos, build-firmware]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      # Only for CHANGELOG.md, which the release notes are read out of. It has
      # to run before the download: checkout cleans the workspace, and would
      # take the artifacts with it.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Written from inside the directory so each line names the file alone,
      # which is the form `sha256sum -c` expects; the glob is expanded before
      # the redirection creates the file, so it cannot list itself.
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The notes are the changelog entry for this version. A release candidate
      # reads the section for the version it is a candidate for. If neither
      # exists the release still goes out, pointing at the file, rather than
      # failing after every platform has already built.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          for want in "$version" "${version%%-*}"; do
            awk -v hdr="## $want" '
              $0 == hdr { inside = 1; next }
              /^## /    { if (inside) exit }
              inside    { print }
            ' CHANGELOG.md > notes.md
            [ -s notes.md ] && break
          done
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section for $version; falling back." >&2
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md).\n' \
              "$GITHUB_REPOSITORY" > notes.md
          fi
          cat >> notes.md <<'EOF'

          ### Downloads

          | File | What it is |
          |------|------------|
          | `watchboard-*-x86_64.AppImage` | Linux app: `chmod +x` it and run |
          | `WatchBoard-*-macos.dmg` | macOS app (13 Ventura or later) |
          | `WatchBoard-*-setup.exe` | Windows installer (64-bit) |
          | `WatchBoard-library-*.zip` | Arduino library: *Sketch → Include Library → Add .ZIP Library…* |

          ### Verify your download

          ```sh
          sha256sum -c SHA256SUMS.txt --ignore-missing   # Linux
          shasum -a 256 -c SHA256SUMS.txt --ignore-missing   # macOS
          ```
          EOF
          cat notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
